name: anywp_engine
description: AnyWP - Cross-platform Flutter plugin for desktop wallpaper engine (Windows & macOS)
version: 2.6.6
homepage: https://github.com/zhaibin/AnyWallpaper-Engine

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: AnyWPEnginePlugin
        fileName: anywp_engine_plugin.cpp
      macos:
        pluginClass: AnyWPEnginePlugin
  # Note: SDK is automatically injected by plugin, no need to bundle as asset

