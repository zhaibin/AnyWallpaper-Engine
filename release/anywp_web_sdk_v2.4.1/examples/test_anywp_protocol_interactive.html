<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anywp:// Protocol Test (Interactive Wallpaper)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            overflow-y: auto;
            height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .status-banner {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }
        .status-ok { 
            border-left: 5px solid #4ade80; 
            background: rgba(74, 222, 128, 0.1);
        }
        .status-error { 
            border-left: 5px solid #f87171; 
            background: rgba(248, 113, 113, 0.1);
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin: 10px;
            font-weight: bold;
            /* 重要：确保按钮可点击 */
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        .warning { color: #fbbf24; }
        .test-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .test-image {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .test-image img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .test-section h2 {
            margin-top: 0;
            font-size: 1.8em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .button-container {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 anywp:// Protocol Test</h1>
        <p class="subtitle">Interactive Wallpaper Version (v2.1.10+)</p>

        <!-- SDK 状态横幅 -->
        <div class="status-banner" id="sdkStatus">
            <span id="sdkStatusText">⏳ 正在加载 AnyWP SDK...</span>
        </div>

        <div class="test-section">
            <h2>🚀 测试控制台</h2>
            <div class="button-container">
                <button class="btn" id="btnEncrypt" disabled>
                    Step 1: Encrypt Files
                </button>
                <button class="btn" id="btnTest" disabled>
                    Step 2: Test Protocol
                </button>
                <button class="btn" id="btnClear">
                    Clear
                </button>
            </div>
            <div class="result" id="result"></div>
            <div class="test-images" id="testImages"></div>
        </div>

        <div class="test-section">
            <h2>📋 使用说明</h2>
            <ol style="line-height: 2; font-size: 1.05em;">
                <li>等待 SDK 加载（顶部横幅变绿）</li>
                <li>点击 <strong>"Step 1"</strong> 加密测试图片</li>
                <li>点击 <strong>"Step 2"</strong> 测试协议</li>
                <li>观察图片显示结果</li>
            </ol>
            <p style="margin-top: 20px; padding: 15px; background: rgba(255, 165, 0, 0.1); border-left: 4px solid orange; border-radius: 5px;">
                💡 <strong>提示</strong>: 在交互式壁纸中，按钮使用 <code>AnyWP.onClick()</code> 处理点击事件
            </p>
        </div>
    </div>

    <script>
        // 全局变量
        let sdkReady = false;
        const testDir = 'C:/Users/1/Desktop/AnyWP_Test';
        const cacheDir = 'C:/Users/1/Desktop/AnyWP_Test/cache';

        // 日志函数
        function log(msg, type = 'info') {
            const result = document.getElementById('result');
            const time = new Date().toLocaleTimeString();
            const cls = type === 'success' ? 'success' : 
                        type === 'error' ? 'error' : 
                        type === 'warning' ? 'warning' : 'info';
            result.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
            result.scrollTop = result.scrollHeight;
        }

        function clearResults() {
            document.getElementById('result').innerHTML = '';
            document.getElementById('testImages').innerHTML = '';
        }

        // 更新 SDK 状态
        function updateSDKStatus(ready, message) {
            sdkReady = ready;
            const banner = document.getElementById('sdkStatus');
            const text = document.getElementById('sdkStatusText');
            
            if (ready) {
                banner.className = 'status-banner status-ok';
                text.textContent = '✅ ' + message;
                document.getElementById('btnEncrypt').disabled = false;
                document.getElementById('btnTest').disabled = false;
            } else {
                banner.className = 'status-banner status-error';
                text.textContent = '❌ ' + message;
            }
        }

        // 检查 SDK 可用性
        function checkSDK() {
            log('🔍 检查 AnyWP SDK...', 'info');
            
            if (typeof window.AnyWP === 'undefined') {
                log('❌ window.AnyWP 未定义', 'error');
                updateSDKStatus(false, 'AnyWP SDK 未加载');
                return false;
            }
            
            log('✅ window.AnyWP 已定义', 'success');
            log(`   版本: ${window.AnyWP.version || 'unknown'}`, 'info');
            
            // 检查必需的 API
            const requiredAPIs = ['encryptFile', 'decryptFile', 'onClick'];
            let allPresent = true;
            
            for (const api of requiredAPIs) {
                if (typeof window.AnyWP[api] === 'function') {
                    log(`   ✅ AnyWP.${api}() 可用`, 'success');
                } else {
                    log(`   ❌ AnyWP.${api}() 不可用`, 'error');
                    allPresent = false;
                }
            }
            
            if (allPresent) {
                updateSDKStatus(true, `AnyWP SDK v${window.AnyWP.version} 已就绪`);
                setupClickHandlers();
                return true;
            } else {
                updateSDKStatus(false, 'AnyWP SDK API 不完整');
                return false;
            }
        }

        // 设置点击处理器（使用 AnyWP.onClick）
        function setupClickHandlers() {
            log('🖱️ 注册交互式点击处理器...', 'info');
            
            try {
                // Step 1: 加密按钮
                window.AnyWP.onClick('#btnEncrypt', function(x, y) {
                    log(`点击 Step 1 按钮 at (${x}, ${y})`, 'info');
                    encryptFiles();
                });
                
                // Step 2: 测试按钮
                window.AnyWP.onClick('#btnTest', function(x, y) {
                    log(`点击 Step 2 按钮 at (${x}, ${y})`, 'info');
                    testProtocol();
                });
                
                // Clear 按钮
                window.AnyWP.onClick('#btnClear', function(x, y) {
                    log(`点击 Clear 按钮 at (${x}, ${y})`, 'info');
                    clearResults();
                });
                
                log('✅ 点击处理器注册成功', 'success');
                log('💡 现在可以点击按钮进行测试', 'info');
            } catch (error) {
                log(`❌ 注册点击处理器失败: ${error.message}`, 'error');
                console.error('onClick setup error:', error);
            }
        }

        // Step 1: 加密文件
        async function encryptFiles() {
            clearResults();
            log('🔐 开始加密测试文件...', 'info');
            log(`📂 测试目录: ${testDir}`, 'info');
            log(`📦 缓存目录: ${cacheDir}`, 'info');
            
            if (!sdkReady) {
                log('❌ AnyWP SDK 未就绪，无法加密', 'error');
                return;
            }

            const files = [
                { source: `${testDir}/test_image_001.jpg`, dest: `${cacheDir}/img_001.encrypted` },
                { source: `${testDir}/test_image_002.jpg`, dest: `${cacheDir}/img_002.encrypted` },
                { source: `${testDir}/test_image_003.jpg`, dest: `${cacheDir}/img_003.encrypted` }
            ];

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                log(`\n[${i + 1}/3] 加密: ${file.source}`, 'info');
                log(`        目标: ${file.dest}`, 'info');

                try {
                    const result = await window.AnyWP.encryptFile(file.source, file.dest);
                    
                    if (result === true) {
                        log(`✅ 加密成功`, 'success');
                        successCount++;
                    } else {
                        log(`❌ 加密失败 (返回值: ${result})`, 'error');
                    }
                } catch (e) {
                    log(`❌ 加密异常: ${e.message}`, 'error');
                    console.error('Encryption error:', e);
                }
            }

            log(`\n📊 加密完成: ${successCount}/3 成功`, successCount === 3 ? 'success' : 'warning');
            
            if (successCount === 3) {
                log('✅ 所有文件加密成功！现在可以测试协议了。', 'success');
            } else {
                log('⚠️ 部分文件加密失败，协议测试可能不完整。', 'warning');
            }
        }

        // Step 2: 测试协议
        async function testProtocol() {
            const imagesDiv = document.getElementById('testImages');
            imagesDiv.innerHTML = '';

            log('\n🚀 开始测试 anywp:// 协议...', 'info');

            const testFiles = [
                `${cacheDir}/img_001.encrypted`,
                `${cacheDir}/img_002.encrypted`,
                `${cacheDir}/img_003.encrypted`
            ];

            testFiles.forEach((path, index) => {
                const url = `anywp://file?path=${path}`;
                log(`\n[Test ${index + 1}]`, 'info');
                log(`  路径: ${path}`, 'info');
                log(`  URL:  ${url}`, 'info');

                const div = document.createElement('div');
                div.className = 'test-image';

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Test ${index + 1}`;

                img.onload = () => {
                    log(`  ✅ 加载成功 - ${path}`, 'success');
                };

                img.onerror = (e) => {
                    log(`  ❌ 加载失败 - ${path}`, 'error');
                    console.error('Image load error:', e);
                };

                const label = document.createElement('p');
                label.textContent = `Test Image ${index + 1}`;
                label.style.fontSize = '1.2em';
                label.style.fontWeight = 'bold';

                const pathLabel = document.createElement('p');
                pathLabel.textContent = path;
                pathLabel.style.fontSize = '0.8em';
                pathLabel.style.opacity = '0.7';
                pathLabel.style.wordBreak = 'break-all';

                div.appendChild(img);
                div.appendChild(label);
                div.appendChild(pathLabel);
                imagesDiv.appendChild(div);
            });

            log('\n⏳ 等待图片加载...', 'info');
        }

        // 页面加载完成
        window.addEventListener('DOMContentLoaded', () => {
            log('✅ 测试页面加载完成', 'success');
            log('📦 AnyWP Engine v2.1.10 - Custom Protocol Test', 'info');
            log('🖱️ 交互式壁纸模式', 'warning');
            log('', 'info');
            
            // 等待 SDK 加载（延迟检查）
            setTimeout(() => {
                checkSDK();
            }, 1000);
        });

        // 监听 AnyWP SDK 加载事件
        window.addEventListener('AnyWP:ready', () => {
            log('\n🎉 收到 AnyWP:ready 事件', 'success');
            checkSDK();
        });

        // 定期检查 SDK（防止事件丢失）
        let checkCount = 0;
        const checkInterval = setInterval(() => {
            if (!sdkReady && checkCount < 10) {
                checkCount++;
                if (typeof window.AnyWP !== 'undefined') {
                    clearInterval(checkInterval);
                    checkSDK();
                }
            } else if (checkCount >= 10) {
                clearInterval(checkInterval);
                log('⚠️ SDK 检查超时，请刷新页面重试', 'warning');
                updateSDKStatus(false, 'SDK 加载超时');
            }
        }, 500);
    </script>
</body>
</html>
