<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyWP Interactive Mode Test</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            user-select: none;
        }

        .container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .status-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .status-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            opacity: 0.8;
        }

        .status-card .value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .interactive-box {
            background: rgba(255, 255, 255, 0.15);
            border: 3px dashed rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .interactive-box:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
        }

        .interactive-box:active {
            transform: scale(0.98);
        }

        .interactive-box h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .interactive-box p {
            font-size: 18px;
            opacity: 0.9;
        }

        .click-counter {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .mode-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .mode-icon {
            font-size: 24px;
        }

        .mode-simple {
            border: 2px solid #888;
            color: #ccc;
        }

        .mode-interactive {
            border: 2px solid #ff9500;
            color: #ff9500;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 149, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 149, 0, 0.8);
            }
        }

        .draggable {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 15px 25px;
            cursor: move;
            user-select: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .draggable:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="mode-indicator" id="modeIndicator">
        <span class="mode-icon" id="modeIcon">🖱️</span>
        <span id="modeText">Simple Mode</span>
    </div>

    <div class="container">
        <h1>🎯 Interactive Mode Test</h1>
        <p class="subtitle">Toggle interactive mode in the Flutter app to see the difference</p>

        <div class="status-grid">
            <div class="status-card">
                <h3>SDK Status</h3>
                <div class="value" id="sdkStatus">...</div>
            </div>
            <div class="status-card">
                <h3>Platform</h3>
                <div class="value" id="platform">...</div>
            </div>
            <div class="status-card">
                <h3>Interactive Mode</h3>
                <div class="value" id="interactiveMode">Unknown</div>
            </div>
            <div class="status-card">
                <h3>Total Events</h3>
                <div class="value" id="eventCount">0</div>
            </div>
        </div>

        <div class="interactive-box" id="clickBox">
            <h2>🎮 Click Me!</h2>
            <p>This box responds to clicks when Interactive Mode is enabled</p>
            <div class="click-counter">
                <span id="clickCount">0</span> clicks
            </div>
        </div>

        <div class="log-container">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffd700;">📝 Event Log:</div>
            <div id="eventLog"></div>
        </div>
    </div>

    <!-- Draggable elements (only work in interactive mode) -->
    <div class="draggable" id="draggable1" style="left: 50px; top: 200px;">Drag me! 🚀</div>
    <div class="draggable" id="draggable2" style="left: 150px; top: 300px;">Or me! ⭐</div>

    <script>
        // State
        let clickCount = 0;
        let eventCount = 0;
        let isInteractive = false;
        let logs = [];
        const maxLogs = 10;

        // Initialize
        function init() {
            addLog('🚀 Page loaded');
            
            // Check SDK
            if (window.AnyWP) {
                document.getElementById('sdkStatus').textContent = '✅ Ready';
                document.getElementById('platform').textContent = window.AnyWP.platform || 'Unknown';
                addLog(`✅ SDK detected: v${window.AnyWP.version}, platform: ${window.AnyWP.platform}`);
            } else {
                document.getElementById('sdkStatus').textContent = '❌ Not Found';
                document.getElementById('platform').textContent = 'N/A';
                addLog('❌ AnyWP SDK not detected');
            }

            // Click box
            document.getElementById('clickBox').addEventListener('click', function() {
                clickCount++;
                document.getElementById('clickCount').textContent = clickCount;
                addLog(`👆 Click box clicked! Count: ${clickCount}`);
                
                // Send message to Flutter
                if (window.AnyWP) {
                    window.AnyWP.sendMessage({
                        type: 'userClick',
                        data: {
                            element: 'clickBox',
                            count: clickCount,
                            timestamp: new Date().toISOString()
                        }
                    });
                }
            });

            // Setup draggables
            setupDraggable('draggable1');
            setupDraggable('draggable2');

            // Listen for messages from Flutter
            window.addEventListener('AnyWP:message', function(event) {
                eventCount++;
                document.getElementById('eventCount').textContent = eventCount;
                
                const message = event.detail;
                console.log('[AnyWP] Message received:', message);

                if (message.type === 'interactiveMode') {
                    const interactive = message.data.interactive;
                    updateInteractiveMode(interactive);
                    addLog(`🔄 Interactive mode ${interactive ? 'enabled' : 'disabled'}`);
                } else if (message.type === 'powerState') {
                    const { oldState, newState } = message.data;
                    addLog(`⚡ Power state: ${oldState} → ${newState}`);
                } else {
                    addLog(`📨 Message: ${JSON.stringify(message).substring(0, 50)}...`);
                }
            });

            addLog('👂 Event listeners registered');
        }

        function updateInteractiveMode(interactive) {
            isInteractive = interactive;
            document.getElementById('interactiveMode').textContent = interactive ? 'ON' : 'OFF';
            
            const indicator = document.getElementById('modeIndicator');
            const icon = document.getElementById('modeIcon');
            const text = document.getElementById('modeText');
            
            if (interactive) {
                indicator.className = 'mode-indicator mode-interactive';
                icon.textContent = '👆';
                text.textContent = 'Interactive Mode';
            } else {
                indicator.className = 'mode-indicator mode-simple';
                icon.textContent = '🖱️';
                text.textContent = 'Simple Mode';
            }
        }

        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logs.unshift(`[${timestamp}] ${message}`);
            if (logs.length > maxLogs) {
                logs.pop();
            }
            
            const logContainer = document.getElementById('eventLog');
            logContainer.innerHTML = logs.map(log => 
                `<div class="log-entry">${log}</div>`
            ).join('');
        }

        // Draggable functionality
        function setupDraggable(id) {
            const element = document.getElementById(id);
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;

                if (e.target === element) {
                    isDragging = true;
                    addLog(`🤏 Started dragging: ${element.textContent.trim()}`);
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    xOffset = currentX;
                    yOffset = currentY;

                    setTranslate(currentX, currentY, element);
                }
            }

            function dragEnd(e) {
                if (isDragging) {
                    initialX = currentX;
                    initialY = currentY;
                    isDragging = false;
                    addLog(`✋ Stopped dragging: ${element.textContent.trim()}`);
                    
                    // Send message to Flutter
                    if (window.AnyWP) {
                        window.AnyWP.sendMessage({
                            type: 'dragEnd',
                            data: {
                                element: id,
                                position: { x: currentX, y: currentY }
                            }
                        });
                    }
                }
            }

            function setTranslate(xPos, yPos, el) {
                el.style.transform = `translate(${xPos}px, ${yPos}px)`;
            }
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
